<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300, initial-scale=1.0">
  <title>Bijoy Bayanno</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="popup-title">Bijoy Bayanno</h1>
    <p class="popup-subtitle">Bengali Input Tool</p>

    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="status-value" id="status-value">OFF</span>
    </div>

    <button class="toggle-btn" id="toggle-btn">Turn ON</button>

    <div class="info-section">
      <p><strong>Shortcut:</strong> Ctrl+Shift+B</p>
      <p class="hint">Press the shortcut on any webpage to start typing in Bengali using the Bijoy Bayanno layout.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
